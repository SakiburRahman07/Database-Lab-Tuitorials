name: Validate markdown and SQL consistency
on:
  push:
  pull_request:
jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run static lesson consistency check
        run: python scripts/validate_repo.py
